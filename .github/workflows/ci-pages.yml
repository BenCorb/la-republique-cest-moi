# Vérification continue et déploiement GitHub Pages.
#
# - À chaque push et pull request : contrôles, tests unitaires, build statique et
#   tests navigateur, ces derniers sous un sous-répertoire (comme un site de projet).
# - Déploiement : uniquement sur déclenchement manuel (« Run workflow », option
#   « deploy »), après succès des vérifications. Aucune publication automatique.
#
# Prérequis côté dépôt : Settings → Pages → Source « GitHub Actions ».
# Domaine personnalisé : le configurer dans Settings → Pages ; `configure-pages`
# renvoie alors un base path vide et le build s'adapte sans modification.
#
# Les actions sont épinglées par SHA de commit (version indiquée en commentaire).

name: CI et GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Déployer sur GitHub Pages après les vérifications'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Vérifications et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Sous-répertoire de test : vérifie les chemins comme sur <compte>.github.io/<dépôt>/.
      BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run content:validate
      - run: npm run test
      - run: npm run simulate -- --runs 25 --seed ci-p1-10 --strategy all --max-turns 400 --format json --output /tmp/lrcm-simulation-ci.json
      - run: npm run build

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build-pages:
    name: Build GitHub Pages
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read # lecture de la configuration Pages par configure-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Lire la configuration Pages (base path)
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - run: npm ci

      - name: Build statique
        run: npm run build
        env:
          # "/<dépôt>" pour un site de projet, "" pour un domaine personnalisé.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  deploy:
    name: Déployer sur GitHub Pages
    needs: build-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
